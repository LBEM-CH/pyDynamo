name: CI

on:
  push:
  pull_request:

# the workflow only reads the repository
permissions:
  contents: read

jobs:
  cpu-tests:
    # GitHub-hosted runners have no GPU: the CPU tests run here and need no GPU, Dynamo installation, data or FFTW.
    # The GPU tests (marker "gpu") are opt-in (PYDYN_GPU_TESTS=1, inside a GPU job) and are deselected here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false            # report every Python version, even when one fails
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: prototype/requirements-ci.txt
      - name: Install CPU dependencies
        run: python -m pip install --upgrade pip && pip install -r prototype/requirements-ci.txt
      - name: Compile all Python files
        run: python -m compileall -q prototype requirements
      - name: Unit tests (CPU)
        # no FFTW, explicitly (tests that need it are skipped), whatever libraries the runner image has
        env:
          PYDYN_FFTW_LIB: /nonexistent/libfftw3.so.3
        run: python -m pytest -m "not gpu"
      - name: No large or data files tracked
        shell: bash
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.em|*.mrc|*.mrcs|*.rec|*.btbl|*.btbl.pydyn|*.tbl|*.mat|*.npy|*.npz|*.h5|*.tar|*.gz) echo "data file: $f"; bad=1 ;;
            esac
            if s=$(stat -c %s -- "$f" 2>/dev/null) && [ "$s" -gt 1048576 ]; then
              echo "large file: $f ($s bytes)"; bad=1
            fi
          done < <(git ls-files -z)
          exit "$bad"
